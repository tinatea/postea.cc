# 課程頁的兩堂課，和「怎麼選？」。改文字即可。
# 調香探索與體驗的時長、成品還沒定，先不要加。頁面上不要出現「待補」。
# 每月主題調香的單場日期、地點、報名在試算表的「活動」分頁。費用若改了，這裡的價格也要一起改。

explore:
  title: 調香探索與體驗
  subtitle: 為你一個人調的香
  body: |
    想要一瓶真正屬於自己的香水嗎？Tina 會陪你一對一聊聊喜歡的氣味、記憶和心情，從香料櫃裡一支一支找出你的味道，調成獨一無二的配方。也可以約朋友、伴侶一起來，兩到四人同行，各自調出自己的那一瓶。
  prices:
    - 一對一 NT$2,000
    - 兩至四人同行，每人 NT$1,800
  cta: 用 LINE 預約
  href: https://line.me/R/ti/p/@144eqxql

gathering:
  title: 每月主題調香
  subtitle: 一群人，一起走進這個月的香氣故事
  body: |
    每個月一個主題，像 11 月是「桂花茶室」。大家從同一款主題基底出發，跟著 Tina 聞香、玩香，再加入自己喜歡的方向。中間一起喝茶、分享彼此調出的味道，最後各自帶走一瓶 10ml 的主題香水。
  prices:
    - 每人 NT$800
  cta: 看本月主題
  href: /events

choose:
  title: 怎麼選？
  paragraphs:
    - 第一次接觸調香、想輕鬆體驗、喜歡和大家一起玩，選每月主題調香。
    - 想要專屬於自己、更深入的調香時光，或想送給重要的人一份特別的禮物，選調香探索與體驗。
