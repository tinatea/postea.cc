# 只有試算表讀不到、或日期／主題色格式不對時，網站才用這份。
#
# 怎麼加一場：複製下面整段，貼在清單最上面，改成新的內容。
# - 日期寫成 "2026-11-22"。時間可以寫 "14:30"，或把整句放進 schedule。
# - registrationUrl 先留 "" 。沒有 https 網址就不會出現「前往報名」。
#   有 Google 表單網址再貼上，例如 "https://forms.gle/xxxx"。
# - 報名狀態可不填。沒填開放時間時，畫面是「即將開放」。說明見 docs/維護說明.md。
# - accentColor 可省略。這場「晚寄的桂花」用桂花金 "#D9A441"。
# - 日期早於今天（台北時間）的場次會自動出現在「過往活動」，不用搬位置、也不用刪。

