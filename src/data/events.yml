  description: |
    秋天的桂花到了尾聲，晚了一點寄給妳。「晚寄的桂花」把這段尾聲留在一間午後的茶室：剛泡好的大吉嶺、窗外的桂花、溫暖的木桌。

    每個人從同一杯「桂花茶」出發，再決定自己的茶室要更清亮（窗邊的柚子與綠茶）、更甘潤（無花果、橙花和柔軟的麝香），或是更沉穩（黑茶、檀香和檜木）。最後帶走的那一瓶，是「我心中的那間茶室」。

    Tina 會帶大家一支一支聞香、講解。入座先喝一口店裡的桂花飲品，再開始調香，分享彼此調出的茶室。
