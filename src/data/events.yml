  description: |
    秋天的台北，巷子裡飄著桂花香。「桂花茶室」想帶大家走進一間午後的茶室：剛泡好的大吉嶺、窗外的桂花、溫暖的木桌。

    每個人從同一杯「桂花茶」出發，再決定自己的茶室要更清亮（窗邊的柚子與綠茶）、更甘潤（無花果、橙花和柔軟的麝香），或是更沉穩（黑茶、檀香和檜木）。最後帶走的那一瓶，是「我心中的那間茶室」。
